name: Deploy KanTanMarkdown to GitHub Pages

on:
  release:
    types: [published]
  workflow_dispatch:

# GITHUB_TOKEN に GitHub Pages へのデプロイ権限を設定
permissions:
  contents: read
  pages: write
  id-token: write

# 同時デプロイの制御（進行中のデプロイをキャンセルせず完了させる）
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Sync version with release tag and build
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            printf '%s' "$RELEASE_TAG" > src/kantanVersion.txt
          elif [ "$REF_TYPE" = "tag" ] && [ -n "$REF_NAME" ]; then
            printf '%s' "$REF_NAME" > src/kantanVersion.txt
          else
            LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
            if [ -n "$LATEST_TAG" ]; then
              printf '%s' "$LATEST_TAG" > src/kantanVersion.txt
            fi
          fi
          npm install
          npx grunt build
          npm test
          rm -rf node_modules

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          # リポジトリ全体（ktm-new.html および dist/ 配下を含む）を公開対象とする
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
