name: Deploy KanTanMarkdown to GitHub Pages

on:
  release:
    types: [published]
  push:
    branches:
      - master
    paths:
      - 'src/**'
      - 'Gruntfile.js'
      - 'package.json'
      - 'ktm-new.html'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

# GITHUB_TOKEN に GitHub Pages へのデプロイ権限およびバージョン同期コミット権限を設定
permissions:
  contents: write
  pages: write
  id-token: write

# 同時デプロイの制御（進行中のデプロイをキャンセルせず完了させる）
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Build and prepare distribution artifacts
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          git fetch origin master --tags
          LATEST_TAG=$(git tag --sort=-v:refname | head -n 1)

          if [ "$EVENT_NAME" = "push" ]; then
            # masterマージ時: リリース公開中の dist/ 直下および ktm-new.html を保護しつつ dist/preview/ のみを更新
            mkdir -p /tmp/release-backup
            cp -p src/kantanVersion.txt dist/kantanUpdate.js dist/ktm-dev.html dist/ktm-lite.html dist/ktm-std.html dist/ktm-full.html ktm-new.html /tmp/release-backup/

            npm install --no-package-lock
            npx grunt build
            mkdir -p dist/preview
            cp -p dist/kantanUpdate.js dist/ktm-dev.html dist/ktm-lite.html dist/ktm-std.html dist/ktm-full.html dist/preview/

            # dist/ 直下のリリース公開中ファイルを最新リリース版（または退避ファイル）から復元し、ktm-new.html はビルド前の状態を維持
            if [ -n "$LATEST_TAG" ] && git cat-file -e "${LATEST_TAG}:dist/ktm-lite.html" 2>/dev/null; then
              git checkout "$LATEST_TAG" -- src/kantanVersion.txt dist/kantanUpdate.js dist/ktm-dev.html dist/ktm-lite.html dist/ktm-std.html dist/ktm-full.html
            else
              cp -p /tmp/release-backup/kantanVersion.txt src/kantanVersion.txt
              cp -p /tmp/release-backup/kantanUpdate.js /tmp/release-backup/ktm-dev.html /tmp/release-backup/ktm-lite.html /tmp/release-backup/ktm-std.html /tmp/release-backup/ktm-full.html dist/
            fi
            cp -p /tmp/release-backup/ktm-new.html ./ktm-new.html
            rm -rf /tmp/release-backup

            # リリース版の容量表記は維持しつつ、プレビュー版テーブルのファイルサイズ表記を dist/preview/ の実サイズで更新
            node scripts/update-new-sizes.js

            npm test
            rm -rf dist/temp node_modules package-lock.json
          else
            # リリース公開時 / workflow_dispatch 時: dist/preview/ktm-*.html および kantanUpdate.js を dist/ 直下 にコピーして更新
            git checkout -B master origin/master

            TARGET_TAG=""
            if [ -n "$RELEASE_TAG" ]; then
              TARGET_TAG="$RELEASE_TAG"
            elif [ "$REF_TYPE" = "tag" ] && [ -n "$REF_NAME" ]; then
              TARGET_TAG="$REF_NAME"
            elif [ -n "$LATEST_TAG" ]; then
              TARGET_TAG="$LATEST_TAG"
            fi

            cp -p dist/preview/kantanUpdate.js dist/preview/ktm-dev.html dist/preview/ktm-lite.html dist/preview/ktm-std.html dist/preview/ktm-full.html dist/

            if [ -n "$TARGET_TAG" ]; then
              printf '%s' "$TARGET_TAG" > src/kantanVersion.txt
              node -e '
                const fs = require("fs");
                const ver = process.argv[1];
                for (const f of ["dist/ktm-dev.html", "dist/ktm-lite.html", "dist/ktm-std.html", "dist/ktm-full.html"]) {
                  fs.writeFileSync(f, fs.readFileSync(f, "utf8").replace(/id="kantanVersion" value="[^"]*"/g, `id="kantanVersion" value="${ver}"`));
                }
                const u = "dist/kantanUpdate.js";
                fs.writeFileSync(u, fs.readFileSync(u, "utf8")
                  .replace(/"newVersion":\s*"[^"]*"/, `"newVersion": "${ver}"`)
                  .replace(/id=\\"kantanVersion\\" value=\\"[^\\"]*\\"/g, `id=\\"kantanVersion\\" value=\\"${ver}\\"`));
              ' "$TARGET_TAG"
            fi

            node scripts/update-new-sizes.js
            npm test
          fi

      - name: Commit synced artifacts back to master
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "$EVENT_NAME" = "push" ]; then
            git add dist/preview/ src/kantanVersion.txt dist/kantanUpdate.js dist/ktm-dev.html dist/ktm-lite.html dist/ktm-std.html dist/ktm-full.html ktm-new.html
            if ! git diff --cached --quiet; then
              git commit -m "chore(preview): update dist/preview from master [skip ci]"
              git pull --rebase origin master
              git push origin HEAD:refs/heads/master
            fi
          else
            TARGET_TAG=""
            if [ -n "$RELEASE_TAG" ]; then
              TARGET_TAG="$RELEASE_TAG"
            elif [ "$REF_TYPE" = "tag" ] && [ -n "$REF_NAME" ]; then
              TARGET_TAG="$REF_NAME"
            else
              TARGET_TAG=$(git tag --sort=-v:refname | head -n 1)
            fi

            git add src/kantanVersion.txt dist/kantanUpdate.js dist/ktm-dev.html dist/ktm-lite.html dist/ktm-std.html dist/ktm-full.html ktm-new.html
            if [ -n "$TARGET_TAG" ] && ! git diff --cached --quiet; then
              git commit -m "chore(release): sync version to ${TARGET_TAG} [skip ci]"
              git pull --rebase origin master
              git push origin HEAD:refs/heads/master
              git tag -f "$TARGET_TAG" HEAD
              git push -f origin "refs/tags/$TARGET_TAG"
            fi

            # actions/deploy-pages が最新コミットSHAを pages_build_version として使用し直前の push デプロイと衝突しないよう更新
            echo "GITHUB_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          fi

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          # リポジトリ全体（ktm-new.html、リリース版 dist/ 直下、および dist/preview/ 配下を含む）を公開対象とする
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
